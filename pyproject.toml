[project]
name = "md-preview-server"
version = "0.1.0"
description = "A local Markdown preview server with live reload"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jamie Scott" }]
dependencies = [
    "flask>=3.0",
    "markdown>=3.5",
    "pymdown-extensions>=10.0",
    "pyyaml>=6.0",
    "pygments>=2.17",
    "watchdog>=4.0",
]

[project.scripts]
md-preview = "md_preview_server.app:main"
md-viewer = "md_viewer_desktop.main:main"

[project.gui-scripts]
# No terminal window when launched from a desktop entry.
md-viewer-gui = "md_viewer_desktop.main:main"

[project.optional-dependencies]
ai = ["openai>=1.0.0"]
dev = ["pytest>=7.0"]
desktop = [
    "pyqt6>=6.7",
    "pyqt6-webengine>=6.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/md_preview_core",
    "src/md_preview_server",
    "src/md_viewer_desktop",
]
