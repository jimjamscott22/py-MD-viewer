[project]
name = "md-preview-server"
version = "0.1.0"
description = "A local Markdown preview server with live reload"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Jamie Scott" }]
dependencies = [
    "flask>=3.0",
    "markdown>=3.5",
    "pymdown-extensions>=10.0",
    "pyyaml>=6.0",
    "pygments>=2.17",
    "watchdog>=4.0",
    "openai>=1.0.0",
]

[project.scripts]
md-preview = "md_preview_server.app:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/md_preview_server"]
